<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Customer support agent architecture</title>
  <desc id="desc">Customer to AgentCore Runtime to Memory, IAM, and Gateway. Gateway Policy allows refunds of 1000 or less and denies refunds above 1000 before MCP tools run. Telemetry goes to CloudWatch.</desc>
  <rect width="920" height="420" fill="#ffffff"/>
  <rect x="24" y="170" width="120" height="64" fill="#f4f4f5" stroke="#3f3f46" rx="4"/>
  <text x="84" y="206" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#18181b">Customer</text>
  <rect x="184" y="146" width="180" height="112" fill="#f4f4f5" stroke="#3f3f46" rx="4"/>
  <text x="274" y="186" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#18181b">AgentCore Runtime</text>
  <text x="274" y="208" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#52525b">Strands agent</text>
  <text x="274" y="228" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#52525b">IAM authorizer</text>
  <rect x="404" y="40" width="160" height="56" fill="#f4f4f5" stroke="#3f3f46" rx="4"/>
  <text x="484" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#18181b">AgentCore Memory</text>
  <rect x="404" y="324" width="160" height="56" fill="#f4f4f5" stroke="#3f3f46" rx="4"/>
  <text x="484" y="356" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#18181b">IAM / Identity</text>
  <rect x="404" y="154" width="200" height="96" fill="#f4f4f5" stroke="#3f3f46" rx="4"/>
  <text x="504" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#18181b">AgentCore Gateway</text>
  <text x="504" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#52525b">MCP + Cedar ENFORCE</text>
  <text x="504" y="228" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#52525b">ALLOW d $1000 / DENY &gt; $1000</text>
  <rect x="644" y="40" width="150" height="48" fill="#f4f4f5" stroke="#3f3f46" rx="4"/>
  <text x="719" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#18181b">get_order</text>
