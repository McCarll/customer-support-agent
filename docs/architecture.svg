  <text x="719" y="136" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#18181b">get_customer</text>
  <rect x="644" y="176" width="150" height="56" fill="#f4f4f5" stroke="#3f3f46" rx="4"/>
  <text x="719" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#18181b">refund_customer</text>
  <text x="719" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#52525b">idempotent</text>
  <rect x="644" y="324" width="236" height="56" fill="#f4f4f5" stroke="#3f3f46" rx="4"/>
  <text x="762" y="356" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#18181b">CloudWatch / OpenTelemetry</text>
